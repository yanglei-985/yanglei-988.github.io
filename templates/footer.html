<div class="wrap">
    <div class="foot-brand">
        <b>{{ blogBase['title'] }}</b>
        <span>{{ blogBase['subTitle'] }}</span>
    </div>
    <div class="foot-meta">
        <div id="footer1">© <span id="copyrightYear"></span> <a href="{{ blogBase['homeUrl'] }}">{{ blogBase['title'] }}</a> · <a href="{{ blogBase['homeUrl'] }}/rss.xml" target="_blank">RSS</a></div>
        <div id="footer2">
            {%- if blogBase['filingNum']!='' -%}
            <span id="filingNum"><a href="https://beian.miit.gov.cn/" target="_blank">{{ blogBase['filingNum'] }}</a> · </span>
            {%- endif %}
            <span id="runday"></span><span>Powered by <a href="https://github.com/Meekdai/Gmeek" target="_blank">Gmeek</a></span>
        </div>
    </div>
</div>

<script>
var now=new Date();
document.getElementById("copyrightYear").innerHTML=now.getFullYear();

if("{{ blogBase['startSite'] }}"!=""){
    var startSite=new Date("{{ blogBase['startSite'] }}");
    var diff=now.getTime()-startSite.getTime();
    var diffDay=Math.floor(diff/(1000*60*60*24));
    document.getElementById("runday").innerHTML="{{ i18n['run'] }}"+diffDay+"{{ i18n['days'] }}"+" · ";
}
</script>
